# ============================================
# MySQL DATABASE CONFIGURATION
# ============================================
# Activate this profile by setting: spring.profiles.active=mysql

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/db_university?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&requireSSL=false
spring.datasource.username=root
spring.datasource.password=Hok@@4455
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings (helps with connection issues)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Transaction Settings
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
