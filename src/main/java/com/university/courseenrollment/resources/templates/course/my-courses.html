<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - University Course Enrollment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>
        
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="bi bi-book"></i> My Courses
                </h1>
            </div>

            <!-- Course Cards -->
            <div class="row" th:if="${courses != null and !courses.isEmpty()}">
                <div class="col-md-6 col-lg-4 mb-4" th:each="course : ${courses}">
                    <div class="card h-100 shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="card-title mb-0" th:text="${course.courseCode}">CS101</h5>
                        </div>
                        <div class="card-body">
                            <h6 class="card-subtitle mb-3" th:text="${course.courseName}">Introduction to Programming</h6>
                            <p class="card-text text-muted small" th:text="${course.description}">Course description here...</p>
                            <ul class="list-unstyled mt-3">
                                <li><i class="bi bi-award text-primary"></i> <strong>Credits:</strong> <span th:text="${course.credits}">3</span></li>
                                <li><i class="bi bi-person text-success"></i> <strong>Lecturer:</strong> 
                                    <span th:if="${course.lecturer != null}" th:text="${course.lecturer.fullName}">John Doe</span>
                                    <span th:unless="${course.lecturer != null}">TBA</span>
                                </li>
                                <li><i class="bi bi-people text-info"></i> <strong>Enrolled:</strong> 
                                    <span th:text="${course.currentEnrolled}">25</span>/<span th:text="${course.maxStudents}">30</span>
                                </li>
                            </ul>
                        </div>
                        <div class="card-footer bg-transparent">
                            <a th:href="@{/course/{id}(id=${course.id})}" class="btn btn-outline-primary btn-sm w-100">
                                <i class="bi bi-eye"></i> View Details
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${courses == null or courses.isEmpty()}" 
                 class="alert alert-info text-center mt-5">
                <i class="bi bi-inbox fs-1"></i>
                <p class="mt-3">You are not enrolled in any courses yet.</p>
                <a th:href="@{/enrollment/enroll}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Browse Available Courses
                </a>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
