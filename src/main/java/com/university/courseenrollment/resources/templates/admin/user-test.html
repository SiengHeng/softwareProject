<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Test</title>
</head>
<body>
    <h1>User List Debug Test</h1>
    <p>Total users in model: <span th:text="${#lists.size(users)}">0</span></p>
    
    <h2>Raw User List:</h2>
    <ul>
        <li th:each="user : ${users}" th:text="${user.id} + ' - ' + ${user.username} + ' - ' + ${user.email}">User</li>
    </ul>
    
    <h2>Table Test:</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.username}">username</td>
                <td th:text="${user.email}">email</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
