<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Enrollments - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>
        
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-clipboard-check me-2"></i>Manage Enrollments</h1>
            </div>

            <!-- Success/Error Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Filter Section -->
            <div class="row mb-4">
                <div class="col-md-12">
                    <div class="btn-group" role="group">
                        <a th:href="@{/admin/enrollments}" 
                           th:classappend="${status == null or status == ''} ? 'active' : ''"
                           class="btn btn-outline-primary">All</a>
                        <a th:href="@{/admin/enrollments(status='PENDING')}" 
                           th:classappend="${status == 'PENDING'} ? 'active' : ''"
                           class="btn btn-outline-warning">Pending</a>
                        <a th:href="@{/admin/enrollments(status='APPROVED')}" 
                           th:classappend="${status == 'APPROVED'} ? 'active' : ''"
                           class="btn btn-outline-success">Approved</a>
                        <a th:href="@{/admin/enrollments(status='REJECTED')}" 
                           th:classappend="${status == 'REJECTED'} ? 'active' : ''"
                           class="btn btn-outline-danger">Rejected</a>
                    </div>
                </div>
            </div>

            <!-- Enrollments Table -->
            <div class="row">
                <div class="col-md-12">
                    <div th:if="${enrollments != null and !enrollments.isEmpty()}">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Student</th>
                                        <th>Student ID</th>
                                        <th>Course</th>
                                        <th>Course Code</th>
                                        <th>Status</th>
                                        <th>Enrolled Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="enrollment : ${enrollments}">
                                        <td th:text="${enrollment.id}">1</td>
                                        <td>
                                            <span th:if="${enrollment.student != null}" 
                                                  th:text="${enrollment.student.firstName + ' ' + enrollment.student.lastName}">John Doe</span>
                                        </td>
                                        <td>
                                            <span th:if="${enrollment.student != null}" 
                                                  th:text="${enrollment.student.studentId}">STU001</span>
                                        </td>
                                        <td>
                                            <span th:if="${enrollment.course != null}" 
                                                  th:text="${enrollment.course.courseName}">Course Name</span>
                                        </td>
                                        <td>
                                            <span th:if="${enrollment.course != null}" 
                                                  th:text="${enrollment.course.courseCode}">CS101</span>
                                        </td>
                                        <td>
                                            <span th:if="${enrollment.status.name() == 'PENDING'}" 
                                                  class="badge bg-warning text-dark">Pending</span>
                                            <span th:if="${enrollment.status.name() == 'APPROVED'}" 
                                                  class="badge bg-success">Approved</span>
                                            <span th:if="${enrollment.status.name() == 'REJECTED'}" 
                                                  class="badge bg-danger">Rejected</span>
                                            <span th:if="${enrollment.status.name() == 'DROPPED'}" 
                                                  class="badge bg-secondary">Dropped</span>
                                        </td>
                                        <td th:text="${enrollment.enrolledAt != null ? #temporals.format(enrollment.enrolledAt, 'yyyy-MM-dd HH:mm') : 'N/A'}">2024-01-15</td>
                                        <td>
                                            <div class="btn-group btn-group-sm" role="group">
                                                <form th:if="${enrollment.status.name() == 'PENDING'}" 
                                                      th:action="@{/admin/enrollments/{id}/approve(id=${enrollment.id})}" 
                                                      method="post" style="display: inline;">
                                                    <button type="submit" class="btn btn-success btn-sm" title="Approve">
                                                        <i class="bi bi-check-circle"></i>
                                                    </button>
                                                </form>
                                                <form th:if="${enrollment.status.name() == 'PENDING'}" 
                                                      th:action="@{/admin/enrollments/{id}/reject(id=${enrollment.id})}" 
                                                      method="post" style="display: inline;">
                                                    <button type="submit" class="btn btn-danger btn-sm" title="Reject"
                                                            onclick="return confirm('Are you sure you want to reject this enrollment?')">
                                                        <i class="bi bi-x-circle"></i>
                                                    </button>
                                                </form>
                                                <a th:if="${enrollment.student != null}" 
                                                   th:href="@{/student/{id}(id=${enrollment.student.id})}" 
                                                   class="btn btn-info btn-sm" title="View Student">
                                                    <i class="bi bi-person"></i>
                                                </a>
                                                <a th:if="${enrollment.course != null}" 
                                                   th:href="@{/course/{id}(id=${enrollment.course.id})}" 
                                                   class="btn btn-primary btn-sm" title="View Course">
                                                    <i class="bi bi-book"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <!-- Empty State -->
                    <div th:if="${enrollments == null or enrollments.isEmpty()}" 
                         class="alert alert-info text-center">
                        <i class="bi bi-info-circle fs-1"></i>
                        <p class="mt-3">No enrollments found.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
