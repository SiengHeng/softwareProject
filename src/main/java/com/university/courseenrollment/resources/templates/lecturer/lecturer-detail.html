<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Lecturer Details</h2>
                <a th:href="@{/lecturers}" class="btn btn-secondary">Back to List</a>
            </div>

            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Personal Information</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Employee ID:</strong> <span th:text="${lecturer.employeeId}"></span></p>
                            <p><strong>Username:</strong> <span th:text="${lecturer.username}"></span></p>
                            <p><strong>Email:</strong> <span th:text="${lecturer.email}"></span></p>
                            <p><strong>Phone:</strong> <span th:text="${lecturer.phoneNumber}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>First Name:</strong> <span th:text="${lecturer.firstName}"></span></p>
                            <p><strong>Last Name:</strong> <span th:text="${lecturer.lastName}"></span></p>
                            <p><strong>Department:</strong> 
                                <span th:if="${lecturer.department != null}" th:text="${lecturer.department.departmentName}"></span>
                                <span th:unless="${lecturer.department != null}" class="text-muted">N/A</span>
                            </p>
                            <p><strong>Status:</strong> 
                                <span th:if="${lecturer.active}" class="badge bg-success">Active</span>
                                <span th:unless="${lecturer.active}" class="badge bg-danger">Inactive</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header">
                    <h5 class="mb-0">Courses Teaching</h5>
                </div>
                <div class="card-body">
                    <table class="table table-striped" th:if="${lecturer.courses != null and !lecturer.courses.isEmpty()}">
                        <thead>
                            <tr>
                                <th>Course Code</th>
                                <th>Course Name</th>
                                <th>Credits</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="course : ${lecturer.courses}">
                                <td th:text="${course.courseCode}"></td>
                                <td th:text="${course.courseName}"></td>
                                <td th:text="${course.credits}"></td>
                                <td>
                                    <span th:if="${course.status.toString() == 'ACTIVE'}" class="badge bg-success">Active</span>
                                    <span th:if="${course.status.toString() == 'INACTIVE'}" class="badge bg-secondary">Inactive</span>
                                    <span th:if="${course.status.toString() == 'ARCHIVED'}" class="badge bg-warning">Archived</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <p th:if="${lecturer.courses == null or lecturer.courses.isEmpty()}" class="text-muted">No courses assigned.</p>
                </div>
            </div>

            <div class="mt-3" sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/lecturers}" class="btn btn-secondary">Back</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
