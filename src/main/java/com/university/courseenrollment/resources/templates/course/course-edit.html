<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-pencil me-2"></i>Edit Course</h1>
                <a th:href="@{/course/list}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Back to List
                </a>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/course/edit/{id}(id=${course.id})}" method="post" th:object="${course}">
                                <input type="hidden" th:field="*{id}">

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="courseCode" class="form-label">Course Code *</label>
                                        <input type="text" class="form-control" id="courseCode"
                                               th:field="*{courseCode}" readonly>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label for="credits" class="form-label">Credits *</label>
                                        <input type="number" class="form-control" id="credits"
                                               th:field="*{credits}" min="1" max="6" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="courseName" class="form-label">Course Name *</label>
                                    <input type="text" class="form-control" id="courseName"
                                           th:field="*{courseName}" required>
                                </div>

                                <div class="mb-3">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" th:field="*{description}" rows="4"></textarea>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="departmentId" class="form-label">Department *</label>
                                        <select class="form-select" id="departmentId" th:field="*{departmentId}" required>
                                            <option value="">Select Department</option>
                                            <option th:each="dept : ${departments}"
                                                    th:value="${dept.id}"
                                                    th:text="${dept.departmentName}">Computer Science</option>
                                        </select>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label for="semesterId" class="form-label">Semester *</label>
                                        <select class="form-select" id="semesterId" th:field="*{semesterId}" required>
                                            <option value="">Select Semester</option>
                                            <option th:each="sem : ${semesters}"
                                                    th:value="${sem.id}"
                                                    th:text="${sem.fullName}">Fall 2024</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="lecturerId" class="form-label">Lecturer</label>
                                        <select class="form-select" id="lecturerId" th:field="*{lecturerId}">
                                            <option value="">Unassigned</option>
                                            <option th:each="lec : ${lecturers}"
                                                    th:value="${lec.id}"
                                                    th:text="${lec.fullName}">John Doe</option>
                                        </select>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label for="maxStudents" class="form-label">Max Students *</label>
                                        <input type="number" class="form-control" id="maxStudents"
                                               th:field="*{maxStudents}" min="1" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="status" class="form-label">Status *</label>
                                    <select class="form-select" id="status" th:field="*{status}" required>
                                        <option value="ACTIVE">Active</option>
                                        <option value="INACTIVE">Inactive</option>
                                        <option value="FULL">Full</option>
                                        <option value="CANCELLED">Cancelled</option>
                                    </select>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check-circle me-2"></i>Update Course
                                    </button>
                                    <a th:href="@{/course/list}" class="btn btn-secondary">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card bg-light">
                        <div class="card-body">
                            <h5 class="card-title"><i class="bi bi-info-circle me-2"></i>Course Info</h5>
                            <ul class="small">
                                <li><strong>Current Enrolled:</strong> <span th:text="${course.currentEnrolled}">0</span></li>
                                <li><strong>Created:</strong> <span th:text="${#temporals.format(course.createdAt, 'yyyy-MM-dd')}">2024-01-01</span></li>
                                <li><strong>Last Updated:</strong> <span th:text="${#temporals.format(course.updatedAt, 'yyyy-MM-dd')}">2024-01-15</span></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
