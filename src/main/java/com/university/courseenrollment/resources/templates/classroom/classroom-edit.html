<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Classroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h4>Edit Classroom</h4>
                </div>
                <div class="card-body">
                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/classroom/edit/{id}(id=${classroom.id})}" th:object="${classroom}" method="post">
                        <div class="mb-3">
                            <label for="roomNumber" class="form-label">Room Number *</label>
                            <input type="text" class="form-control" id="roomNumber" th:field="*{roomNumber}" required>
                        </div>

                        <div class="mb-3">
                            <label for="building" class="form-label">Building *</label>
                            <input type="text" class="form-control" id="building" th:field="*{building}" required>
                        </div>

                        <div class="mb-3">
                            <label for="capacity" class="form-label">Capacity *</label>
                            <input type="number" class="form-control" id="capacity" th:field="*{capacity}" min="1" required>
                        </div>

                        <div class="mb-3">
                            <label for="floor" class="form-label">Floor</label>
                            <input type="number" class="form-control" id="floor" th:field="*{floor}">
                        </div>

                        <div class="mb-3">
                            <label for="facilities" class="form-label">Facilities</label>
                            <textarea class="form-control" id="facilities" th:field="*{facilities}" rows="3" 
                                      placeholder="e.g., Projector, Whiteboard, AC"></textarea>
                            <small class="form-text text-muted">Separate facilities with commas</small>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="available" th:field="*{available}">
                            <label class="form-check-label" for="available">Available for scheduling</label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/classroom/list}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update Classroom</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
