<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Timetable</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <h2 class="mt-3">Weekly Timetable</h2>
            <div class="card">
                <div class="card-body">
                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th style="width: 100px;">Time</th>
                            <th>Monday</th>
                            <th>Tuesday</th>
                            <th>Wednesday</th>
                            <th>Thursday</th>
                            <th>Friday</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="i : ${#numbers.sequence(0, 4)}">
                            <td class="fw-bold">
                                        <span th:switch="${i}">
                                            <span th:case="0">08:00-09:30</span>
                                            <span th:case="1">09:00-10:30</span>
                                            <span th:case="2">11:00-12:30</span>
                                            <span th:case="3">14:00-15:30</span>
                                            <span th:case="4">16:00-17:30</span>
                                        </span>
                            </td>
                            <td th:each="day : ${'MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY'.split(',')}">
                                <!-- Schedule data -->
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
