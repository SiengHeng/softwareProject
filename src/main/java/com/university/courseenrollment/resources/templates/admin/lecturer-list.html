<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lecturer List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <h2 class="mt-3">All Lecturers</h2>
            <div class="card">
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-light">
                        <tr>
                            <th>Employee ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Office</th>
                            <th>Specialization</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="lecturer : ${lecturers}">
                            <td th:text="${lecturer.employeeId}">LEC001</td>
                            <td th:text="${lecturer.fullName}">John Doe</td>
                            <td th:text="${lecturer.email}">john.doe@university.edu</td>
                            <td th:text="${lecturer.department?.departmentName}">Computer Science</td>
                            <td th:text="${lecturer.officeRoom}">CS-201</td>
                            <td th:text="${lecturer.specialization}">Data Structures</td>
                            <td>
                                        <span class="badge"
                                              th:classappend="${lecturer.active} ? 'bg-success' : 'bg-danger'"
                                              th:text="${lecturer.active} ? 'Active' : 'Inactive'">Active</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
