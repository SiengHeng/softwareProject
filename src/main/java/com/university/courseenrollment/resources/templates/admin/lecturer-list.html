<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Lecturer List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-person-workspace me-2"></i>All Lecturers</h1>
            </div>

            <!-- Success/Error Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Lecturer Management (<span th:text="${lecturers.size()}">0</span> lecturers)</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped">
                            <thead class="table-light">
                            <tr>
                                <th>Employee ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Office</th>
                                <th>Specialization</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="lecturer : ${lecturers}">
                                <td th:text="${lecturer.employeeId}">LEC001</td>
                                <td th:text="${lecturer.fullName}">John Doe</td>
                                <td th:text="${lecturer.email}">john.doe@university.edu</td>
                                <td>
                                    <span th:if="${lecturer.department != null}" th:text="${lecturer.department.departmentName}">Computer Science</span>
                                    <span th:unless="${lecturer.department != null}" class="text-muted">N/A</span>
                                </td>
                                <td>
                                    <span th:if="${lecturer.officeRoom != null}" th:text="${lecturer.officeRoom}">CS-201</span>
                                    <span th:unless="${lecturer.officeRoom != null}" class="text-muted">N/A</span>
                                </td>
                                <td>
                                    <span th:if="${lecturer.specialization != null}" th:text="${lecturer.specialization}">Data Structures</span>
                                    <span th:unless="${lecturer.specialization != null}" class="text-muted">N/A</span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${lecturer.active} ? 'bg-success' : 'bg-danger'"
                                          th:text="${lecturer.active} ? 'Active' : 'Inactive'">Active</span>
                                </td>
                                <td>
                                    <a th:href="@{/lecturers/{id}(id=${lecturer.id})}" class="btn btn-sm btn-info">
                                        <i class="bi bi-eye"></i> View
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <div th:if="${lecturers.isEmpty()}" class="alert alert-info">
                            <i class="bi bi-info-circle"></i> No lecturers found in the system.
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
