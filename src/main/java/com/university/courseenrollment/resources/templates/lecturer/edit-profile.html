<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <h2 class="mt-3">Edit Profile</h2>
            <div class="card">
                <div class="card-body">
                    <form th:object="${lecturer}" method="post" enctype="multipart/form-data">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name *</label>
                                <input type="text" class="form-control" th:field="*{firstName}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name *</label>
                                <input type="text" class="form-control" th:field="*{lastName}" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone</label>
                                <input type="tel" class="form-control" th:field="*{phoneNumber}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Profile Picture</label>
                            <div class="mb-2" th:if="${lecturer.profilePictureUrl != null}">
                                <img th:src="${lecturer.profilePictureUrl}" alt="Current Profile Picture"
                                     class="rounded-circle"
                                     style="width: 100px; height: 100px; object-fit: cover; border: 2px solid #0d6efd;">
                            </div>
                            <input type="file" class="form-control" name="profilePicture"
                                   accept="image/jpeg,image/png,image/gif,image/webp">
                            <small class="form-text text-muted">Accepted formats: JPG, PNG, GIF, WEBP. Maximum size: 5MB.</small>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Office Room</label>
                                <input type="text" class="form-control" th:field="*{officeRoom}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Specialization</label>
                                <input type="text" class="form-control" th:field="*{specialization}">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Profile</button>
                        <a th:href="@{/lecturer/profile}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
