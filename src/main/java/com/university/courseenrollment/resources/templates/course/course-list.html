<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Course List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-book me-2"></i>All Courses</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a sec:authorize="hasAnyRole('ADMIN', 'LECTURER')"
                       th:href="@{/course/create}"
                       class="btn btn-sm btn-primary">
                        <i class="bi bi-plus-circle me-1"></i>Create Course
                    </a>
                </div>
            </div>

            <!-- Search and Filter -->
            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/course/list}" method="get" class="row g-3">
                        <div class="col-md-4">
                            <input type="text" name="search" class="form-control"
                                   placeholder="Search by code or name" th:value="${search}">
                        </div>
                        <div class="col-md-3">
                            <select name="status" class="form-select">
                                <option value="">All Status</option>
                                <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Active</option>
                                <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Inactive</option>
                                <option value="FULL" th:selected="${status == 'FULL'}">Full</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select name="departmentId" class="form-select">
                                <option value="">All Departments</option>
                                <option th:each="dept : ${departments}"
                                        th:value="${dept.id}"
                                        th:text="${dept.departmentName}"
                                        th:selected="${departmentId == dept.id}">Department</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search me-1"></i>Search
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Course Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                            <tr>
                                <th>Course Code</th>
                                <th>Course Name</th>
                                <th>Lecturer</th>
                                <th>Credits</th>
                                <th>Enrolled/Max</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="course : ${courses}">
                                <td>
                                    <strong th:text="${course.courseCode}">CS101</strong>
                                </td>
                                <td th:text="${course.courseName}">Introduction to Programming</td>
                                <td th:text="${course.lecturer != null ? course.lecturer.fullName : 'Unassigned'}">John Doe</td>
                                <td>
                                    <span class="badge bg-info" th:text="${course.credits}">3</span>
                                </td>
                                <td>
                                    <div class="progress" style="height: 20px;">
                                        <div class="progress-bar"
                                             th:style="'width: ' + ${course.currentEnrolled * 100 / course.maxStudents} + '%'"
                                             th:classappend="${course.isFull()} ? 'bg-danger' : 'bg-success'">
                                            <span th:text="${course.currentEnrolled} + '/' + ${course.maxStudents}">15/30</span>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                            <span class="badge"
                                                  th:classappend="${course.status == 'ACTIVE' ? 'bg-success' : (course.status == 'FULL' ? 'bg-danger' : 'bg-secondary')}"
                                                  th:text="${course.status}">ACTIVE</span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/course/{id}(id=${course.id})}"
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a sec:authorize="hasAnyRole('ADMIN', 'LECTURER')"
                                           th:href="@{/course/edit/{id}(id=${course.id})}"
                                           class="btn btn-sm btn-outline-warning">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button sec:authorize="hasRole('ADMIN')"
                                                type="button"
                                                class="btn btn-sm btn-outline-danger"
                                                onclick="confirmDelete(this)"
                                                th:attr="data-id=${course.id}">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(courses)}">
                                <td colspan="7" class="text-center text-muted">No courses found</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav th:if="${totalPages > 1}">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/course/list(page=${currentPage - 1}, search=${search})}">Previous</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{/course/list(page=${i}, search=${search})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/course/list(page=${currentPage + 1}, search=${search})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function confirmDelete(button) {
        if (confirm('Are you sure you want to delete this course?')) {
            const courseId = button.getAttribute('data-id');
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/course/delete/' + courseId;
            document.body.appendChild(form);
            form.submit();
        }
    }
</script>
</body>
</html>
