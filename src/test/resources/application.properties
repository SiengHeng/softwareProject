# Google Sheets Integration (Optional)
# =================================
# To enable Google Sheets integration for attendance export:
# 1. Create a Google Cloud Project and enable Google Sheets API
# 2. Create Service Account credentials (JSON file)
# 3. Set google.sheets.enabled=true
# 4. Provide credentials via one of these methods:
#    a) Set google.sheets.credentials.file to path of JSON file
#    b) Set google.sheets.credentials.json to JSON content (base64 or direct)
#    c) Set GOOGLE_APPLICATION_CREDENTIALS environment variable
# 5. Share spreadsheets with the service account email

google.sheets.enabled=false
# google.sheets.credentials.file=./config/google-credentials.json
