<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Courses - Lecturer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>
        
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-journal-text me-2"></i>My Courses</h1>
                <a th:href="@{/course/create}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Create New Course
                </a>
            </div>

            <!-- Course Cards -->
            <div class="row" th:if="${courses != null and !courses.isEmpty()}">
                <div class="col-md-6 col-lg-4 mb-4" th:each="course : ${courses}">
                    <div class="card h-100 shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="card-title mb-0" th:text="${course.courseCode}">CS101</h5>
                        </div>
                        <div class="card-body">
                            <h6 class="card-subtitle mb-3 text-muted" th:text="${course.courseName}">Introduction to Programming</h6>
                            <p class="card-text small" th:text="${course.description}">Course description...</p>
                            
                            <div class="mt-3">
                                <div class="d-flex justify-content-between mb-2">
                                    <span><i class="bi bi-award text-primary"></i> Credits:</span>
                                    <strong th:text="${course.credits}">3</strong>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span><i class="bi bi-people text-success"></i> Enrolled:</span>
                                    <strong>
                                        <span th:text="${course.currentEnrolled}">25</span>/<span th:text="${course.maxStudents}">30</span>
                                    </strong>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span><i class="bi bi-info-circle text-info"></i> Status:</span>
                                    <span th:if="${course.status.name() == 'ACTIVE'}" class="badge bg-success">Active</span>
                                    <span th:if="${course.status.name() == 'INACTIVE'}" class="badge bg-secondary">Inactive</span>
                                    <span th:if="${course.status.name() == 'ARCHIVED'}" class="badge bg-dark">Archived</span>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer bg-transparent">
                            <div class="btn-group w-100" role="group">
                                <a th:href="@{/course/{id}(id=${course.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i> View
                                </a>
                                <a th:href="@{/course/edit/{id}(id=${course.id})}" class="btn btn-sm btn-outline-warning">
                                    <i class="bi bi-pencil"></i> Edit
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${courses == null or courses.isEmpty()}" 
                 class="alert alert-info text-center mt-5">
                <i class="bi bi-inbox fs-1"></i>
                <p class="mt-3">You don't have any courses assigned yet.</p>
                <a th:href="@{/course/create}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Create Your First Course
                </a>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
