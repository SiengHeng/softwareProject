<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Student Details</h2>
                <a th:href="@{/students}" class="btn btn-secondary">Back to List</a>
            </div>

            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Personal Information</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Student ID:</strong> <span th:text="${student.studentId}"></span></p>
                            <p><strong>Username:</strong> <span th:text="${student.username}"></span></p>
                            <p><strong>Email:</strong> <span th:text="${student.email}"></span></p>
                            <p><strong>Phone:</strong> <span th:text="${student.phoneNumber}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>First Name:</strong> <span th:text="${student.firstName}"></span></p>
                            <p><strong>Last Name:</strong> <span th:text="${student.lastName}"></span></p>
                            <p><strong>Major:</strong> <span th:text="${student.major}"></span></p>
                            <p><strong>Status:</strong> 
                                <span th:if="${student.active}" class="badge bg-success">Active</span>
                                <span th:unless="${student.active}" class="badge bg-danger">Inactive</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header">
                    <h5 class="mb-0">Enrollments</h5>
                </div>
                <div class="card-body">
                    <table class="table table-striped" th:if="${student.enrollments != null and !student.enrollments.isEmpty()}">
                        <thead>
                            <tr>
                                <th>Course Code</th>
                                <th>Course Name</th>
                                <th>Status</th>
                                <th>Enrollment Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="enrollment : ${student.enrollments}">
                                <td th:text="${enrollment.course.courseCode}"></td>
                                <td th:text="${enrollment.course.courseName}"></td>
                                <td>
                                    <span th:if="${enrollment.status.toString() == 'APPROVED'}" class="badge bg-success">Approved</span>
                                    <span th:if="${enrollment.status.toString() == 'PENDING'}" class="badge bg-warning">Pending</span>
                                    <span th:if="${enrollment.status.toString() == 'REJECTED'}" class="badge bg-danger">Rejected</span>
                                </td>
                                <td th:text="${#temporals.format(enrollment.enrollmentDate, 'yyyy-MM-dd')}"></td>
                            </tr>
                        </tbody>
                    </table>
                    <p th:if="${student.enrollments == null or student.enrollments.isEmpty()}" class="text-muted">No enrollments found.</p>
                </div>
            </div>

            <div class="mt-3" sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/students}" class="btn btn-secondary">Back</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
