<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Grades - Student Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-clipboard-data me-2"></i>My Grades</h1>
            </div>

            <!-- GPA Overview -->
            <div class="row mb-4">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-body text-center">
                            <h3 class="mb-0">Current GPA</h3>
                            <h1 class="display-3 text-primary" th:text="${#numbers.formatDecimal(gpa, 1, 2)}">0.00</h1>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Grades Table -->
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-list-check me-2"></i>Course Grades</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Course Code</th>
                                    <th>Course Name</th>
                                    <th>Credits</th>
                                    <th>Grade</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="enrollment : ${enrollments}">
                                    <td th:text="${enrollment.course.courseCode}">CS101</td>
                                    <td th:text="${enrollment.course.courseName}">Introduction to Programming</td>
                                    <td th:text="${enrollment.course.credits}">3</td>
                                    <td>
                                        <span th:if="${enrollment.grade != null}" 
                                              class="badge bg-success" 
                                              th:text="${enrollment.grade}">A</span>
                                        <span th:unless="${enrollment.grade != null}" 
                                              class="text-muted">Not graded yet</span>
                                    </td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${enrollment.status == 'APPROVED'} ? 'bg-success' : 
                                                              (${enrollment.status == 'PENDING'} ? 'bg-warning' : 'bg-danger')"
                                              th:text="${enrollment.status}">APPROVED</span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(enrollments)}">
                                    <td colspan="5" class="text-center text-muted">
                                        <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                                        <p class="mt-2">No courses enrolled yet</p>
                                        <a th:href="@{/enrollment/enroll}" class="btn btn-primary">Enroll in Courses</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
