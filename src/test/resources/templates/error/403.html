<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-6 text-center">
            <i class="bi bi-shield-exclamation text-danger" style="font-size: 6rem;"></i>
            <h1 class="display-1 mt-4">403</h1>
            <h2 class="mb-4">Access Denied</h2>
            <p class="lead text-muted">
                You don't have permission to access this resource.
            </p>
            <div class="mt-4">
                <a th:href="@{/dashboard}" class="btn btn-primary me-2">
                    <i class="bi bi-house-door me-2"></i>Go to Dashboard
                </a>
                <a th:href="@{/auth/logout}" class="btn btn-secondary">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
