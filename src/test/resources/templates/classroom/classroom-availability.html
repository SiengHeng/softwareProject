<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Classroom Availability</h2>
                <a th:href="@{/classroom/list}" class="btn btn-secondary">Back to List</a>
            </div>

            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">
                        Classroom: <span th:text="${classroom.building + ' - ' + classroom.roomNumber}"></span>
                    </h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Building:</strong> <span th:text="${classroom.building}"></span></p>
                            <p><strong>Room Number:</strong> <span th:text="${classroom.roomNumber}"></span></p>
                            <p><strong>Capacity:</strong> <span th:text="${classroom.capacity}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Floor:</strong> <span th:text="${classroom.floor}"></span></p>
                            <p><strong>Facilities:</strong> <span th:text="${classroom.facilities}"></span></p>
                            <p><strong>Status:</strong> 
                                <span th:if="${classroom.available}" class="badge bg-success">Available</span>
                                <span th:unless="${classroom.available}" class="badge bg-danger">Unavailable</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Schedule</h5>
                </div>
                <div class="card-body">
                    <table class="table table-bordered" th:if="${schedules != null and !schedules.isEmpty()}">
                        <thead>
                            <tr>
                                <th>Day</th>
                                <th>Time</th>
                                <th>Course</th>
                                <th>Lecturer</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="schedule : ${schedules}">
                                <td th:text="${schedule.dayOfWeek}"></td>
                                <td>
                                    <span th:if="${schedule.timeSlot != null}" 
                                          th:text="${schedule.timeSlot.startTime + ' - ' + schedule.timeSlot.endTime}"></span>
                                </td>
                                <td>
                                    <span th:if="${schedule.course != null}" 
                                          th:text="${schedule.course.courseCode + ' - ' + schedule.course.courseName}"></span>
                                </td>
                                <td>
                                    <span th:if="${schedule.course != null and schedule.course.lecturer != null}" 
                                          th:text="${schedule.course.lecturer.firstName + ' ' + schedule.course.lecturer.lastName}"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${schedules == null or schedules.isEmpty()}" class="alert alert-info">
                        This classroom has no scheduled classes.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
