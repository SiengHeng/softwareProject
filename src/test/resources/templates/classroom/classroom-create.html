<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Classroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-plus-circle me-2"></i>Add New Classroom</h1>
                <a th:href="@{/classroom/list}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Back to List
                </a>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/classroom/create}" method="post" th:object="${classroom}">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="roomNumber" class="form-label">Room Number *</label>
                                        <input type="text" class="form-control" id="roomNumber"
                                               th:field="*{roomNumber}" placeholder="e.g., 101" required>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label for="building" class="form-label">Building *</label>
                                        <input type="text" class="form-control" id="building"
                                               th:field="*{building}" placeholder="e.g., Science Building" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="capacity" class="form-label">Capacity *</label>
                                        <input type="number" class="form-control" id="capacity"
                                               th:field="*{capacity}" min="1" placeholder="e.g., 30" required>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label for="roomType" class="form-label">Room Type</label>
                                        <select class="form-select" id="roomType" th:field="*{roomType}">
                                            <option value="">Select Type</option>
                                            <option value="Lecture Hall">Lecture Hall</option>
                                            <option value="Laboratory">Laboratory</option>
                                            <option value="Tutorial Room">Tutorial Room</option>
                                            <option value="Seminar Room">Seminar Room</option>
                                            <option value="Computer Lab">Computer Lab</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Facilities</label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="hasProjector"
                                               th:field="*{hasProjector}">
                                        <label class="form-check-label" for="hasProjector">
                                            <i class="bi bi-projector me-1"></i>Projector
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="hasComputers"
                                               th:field="*{hasComputers}">
                                        <label class="form-check-label" for="hasComputers">
                                            <i class="bi bi-laptop me-1"></i>Computers
                                        </label>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Availability</label>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="isAvailable"
                                               th:field="*{isAvailable}" checked>
                                        <label class="form-check-label" for="isAvailable">
                                            Available for scheduling
                                        </label>
                                    </div>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check-circle me-2"></i>Create Classroom
                                    </button>
                                    <a th:href="@{/classroom/list}" class="btn btn-secondary">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card bg-light">
                        <div class="card-body">
                            <h5 class="card-title"><i class="bi bi-info-circle me-2"></i>Guidelines</h5>
                            <ul class="small">
                                <li>Room number must be unique</li>
                                <li>Specify building location</li>
                                <li>Set realistic capacity</li>
                                <li>Select appropriate room type</li>
                                <li>Mark available facilities</li>
                                <li>Set availability status</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
