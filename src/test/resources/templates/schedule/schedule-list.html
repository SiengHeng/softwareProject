<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Schedule Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-calendar-week me-2"></i>Schedule Management</h1>
                <a th:href="@{/schedule/create}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i>Create Schedule
                </a>
            </div>

            <!-- Filter Options -->
            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/schedule/list}" method="get" class="row g-3">
                        <div class="col-md-3">
                            <select name="dayOfWeek" class="form-select">
                                <option value="">All Days</option>
                                <option value="MONDAY" th:selected="${dayOfWeek == 'MONDAY'}">Monday</option>
                                <option value="TUESDAY" th:selected="${dayOfWeek == 'TUESDAY'}">Tuesday</option>
                                <option value="WEDNESDAY" th:selected="${dayOfWeek == 'WEDNESDAY'}">Wednesday</option>
                                <option value="THURSDAY" th:selected="${dayOfWeek == 'THURSDAY'}">Thursday</option>
                                <option value="FRIDAY" th:selected="${dayOfWeek == 'FRIDAY'}">Friday</option>
                                <option value="SATURDAY" th:selected="${dayOfWeek == 'SATURDAY'}">Saturday</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select name="classroomId" class="form-select">
                                <option value="">All Classrooms</option>
                                <option th:each="classroom : ${classrooms}"
                                        th:value="${classroom.id}"
                                        th:text="${classroom.fullRoomName}"
                                        th:selected="${classroomId == classroom.id}">Room</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <input type="text" name="search" class="form-control"
                                   placeholder="Search by course" th:value="${search}">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i> Filter
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Schedule Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                            <tr>
                                <th>Course</th>
                                <th>Day</th>
                                <th>Time</th>
                                <th>Classroom</th>
                                <th>Capacity</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="schedule : ${schedules}">
                                <td>
                                    <strong th:text="${schedule.course.courseCode}">CS101</strong><br>
                                    <small class="text-muted" th:text="${schedule.course.courseName}">Intro to Programming</small>
                                </td>
                                <td>
                                    <span class="badge bg-primary" th:text="${schedule.dayOfWeek}">Monday</span>
                                </td>
                                <td th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}">09:00 - 10:30</td>
                                <td>
                                    <i class="bi bi-door-open me-1"></i>
                                    <span th:text="${schedule.classroom.fullRoomName}">Building A - 101</span><br>
                                    <small class="text-muted">
                                        Capacity: <span th:text="${schedule.classroom.capacity}">30</span>
                                    </small>
                                </td>
                                <td>
                                    <span th:text="${schedule.course.currentEnrolled} + '/' + ${schedule.classroom.capacity}">15/30</span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/schedule/edit/{id}(id=${schedule.id})}"
                                           class="btn btn-sm btn-outline-warning">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button type="button"
                                                class="btn btn-sm btn-outline-danger"
                                                onclick="confirmDelete(this)"
                                                th:attr="data-id=${schedule.id}">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(schedules)}">
                                <td colspan="6" class="text-center text-muted">No schedules found</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Weekly View -->
            <div class="card mt-4">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0"><i class="bi bi-calendar3 me-2"></i>Weekly Overview</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                            <tr>
                                <th>Time</th>
                                <th>Monday</th>
                                <th>Tuesday</th>
                                <th>Wednesday</th>
                                <th>Thursday</th>
                                <th>Friday</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="timeSlot : ${timeSlots}">
                                <td class="fw-bold" th:text="${timeSlot}">09:00 - 10:30</td>
                                <td th:each="day : ${'MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY'.split(',')}">
                                    <div th:each="schedule : ${schedules}"
                                         th:if="${schedule.dayOfWeek.name() == day and schedule.startTime.toString() == timeSlot}">
                                        <div class="small bg-primary text-white p-2 rounded mb-1">
                                            <strong th:text="${schedule.course.courseCode}">CS101</strong><br>
                                            <small th:text="${schedule.classroom.roomNumber}">101</small>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function confirmDelete(button) {
        if (confirm('Are you sure you want to delete this schedule?')) {
            const scheduleId = button.getAttribute('data-id');
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/schedule/delete/' + scheduleId;
            document.body.appendChild(form);
            form.submit();
        }
    }
</script>
</body>
</html>
