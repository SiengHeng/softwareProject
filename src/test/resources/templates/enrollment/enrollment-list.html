<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Enrollments - University Course Enrollment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>
        
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">My Enrollments</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/enrollment/enroll}" class="btn btn-sm btn-primary">
                        <i class="bi bi-plus-circle"></i> Enroll in New Course
                    </a>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="row mb-4">
                <div class="col-md-12">
                    <div class="btn-group" role="group">
                        <a th:href="@{/enrollment/list}" 
                           th:classappend="${status == null or status == ''} ? 'active' : ''"
                           class="btn btn-outline-primary">All</a>
                        <a th:href="@{/enrollment/list(status='PENDING')}" 
                           th:classappend="${status == 'PENDING'} ? 'active' : ''"
                           class="btn btn-outline-warning">Pending</a>
                        <a th:href="@{/enrollment/list(status='APPROVED')}" 
                           th:classappend="${status == 'APPROVED'} ? 'active' : ''"
                           class="btn btn-outline-success">Approved</a>
                        <a th:href="@{/enrollment/list(status='REJECTED')}" 
                           th:classappend="${status == 'REJECTED'} ? 'active' : ''"
                           class="btn btn-outline-danger">Rejected</a>
                        <a th:href="@{/enrollment/list(status='DROPPED')}" 
                           th:classappend="${status == 'DROPPED'} ? 'active' : ''"
                           class="btn btn-outline-secondary">Dropped</a>
                    </div>
                </div>
            </div>

            <!-- Enrollments List -->
            <div class="row">
                <div class="col-md-12">
                    <div th:if="${enrollments != null and !enrollments.isEmpty()}">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Course Code</th>
                                        <th>Course Name</th>
                                        <th>Credits</th>
                                        <th>Lecturer</th>
                                        <th>Status</th>
                                        <th>Enrolled Date</th>
                                        <th>Grade</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="enrollment : ${enrollments}">
                                        <td th:text="${enrollment.course != null ? enrollment.course.courseCode : 'N/A'}">CS101</td>
                                        <td th:text="${enrollment.course != null ? enrollment.course.courseName : 'N/A'}">Introduction to Programming</td>
                                        <td th:text="${enrollment.course != null ? enrollment.course.credits : 0}">3</td>
                                        <td>
                                            <span th:if="${enrollment.course != null and enrollment.course.lecturer != null}"
                                                  th:text="${enrollment.course.lecturer.fullName}">John Doe</span>
                                            <span th:unless="${enrollment.course != null and enrollment.course.lecturer != null}">TBA</span>
                                        </td>
                                        <td>
                                            <span th:if="${enrollment.status.name() == 'PENDING'}" 
                                                  class="badge bg-warning text-dark">Pending</span>
                                            <span th:if="${enrollment.status.name() == 'APPROVED'}" 
                                                  class="badge bg-success">Approved</span>
                                            <span th:if="${enrollment.status.name() == 'REJECTED'}" 
                                                  class="badge bg-danger">Rejected</span>
                                            <span th:if="${enrollment.status.name() == 'DROPPED'}" 
                                                  class="badge bg-secondary">Dropped</span>
                                        </td>
                                        <td th:text="${enrollment.enrolledAt != null ? #temporals.format(enrollment.enrolledAt, 'yyyy-MM-dd') : 'N/A'}">2024-01-15</td>
                                        <td th:text="${enrollment.grade != null ? enrollment.grade : '-'}">-</td>
                                        <td>
                                            <div class="btn-group btn-group-sm" role="group">
                                                <a th:if="${enrollment.course != null}" 
                                                   th:href="@{/course/{id}(id=${enrollment.course.id})}" 
                                                   class="btn btn-info btn-sm" title="View Course">
                                                    <i class="bi bi-eye"></i>
                                                </a>
                                                <form th:if="${enrollment.status.name() == 'APPROVED'}" 
                                                      th:action="@{/enrollment/drop/{id}(id=${enrollment.id})}" 
                                                      method="post" style="display: inline;">
                                                    <button type="submit" class="btn btn-danger btn-sm" 
                                                            onclick="return confirm('Are you sure you want to drop this course?')" 
                                                            title="Drop Course">
                                                        <i class="bi bi-trash"></i> Drop
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <!-- Empty State -->
                    <div th:if="${enrollments == null or enrollments.isEmpty()}" 
                         class="alert alert-info text-center">
                        <i class="bi bi-info-circle fs-1"></i>
                        <p class="mt-3">No enrollments found.</p>
                        <a th:href="@{/enrollment/enroll}" class="btn btn-primary">
                            <i class="bi bi-plus-circle"></i> Enroll in a Course
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
